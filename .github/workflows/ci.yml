name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config: [Release]
        include:
          - os: ubuntu-latest  # the asserts (IM_ASSERT) are compiled out in Release: one build keeps them
            config: Debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: GLFW's dependencies (the visible Test Engine tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xorg-dev libwayland-dev libxkbcommon-dev libgl-dev
      - name: Configure (Dear ImGui and its Test Engine fetched)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DIMGUI_KIT_BUILD_TEST_ENGINE_TESTS=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} -j 4
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  # The touch demo in a browser, published on the kit's GitHub Pages (https://pthom.github.io/imgui_kit/)
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.4
      - name: Configure (Emscripten, the touch demo)
        run: emcmake cmake -S . -B build_web -DCMAKE_BUILD_TYPE=Release -DIMGUI_KIT_BUILD_EXAMPLES=ON -DIMGUI_KIT_BUILD_TESTS=OFF
      - name: Fetch Emscripten's GLFW port once, with retries (its GitHub release download is flaky)
        run: for i in 1 2 3; do embuilder build contrib.glfw3 && break; sleep 10; done; embuilder build contrib.glfw3
      - name: Build
        run: cmake --build build_web -j 4
      - name: The page's files
        run: mkdir site && cp build_web/examples/touch_demo/index.{html,js,wasm} site/ && cp llms.txt site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
