name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Dear ImGui fetched, its docking branch)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # The touch demo in a browser, published on the kit's GitHub Pages (https://pthom.github.io/imgui_kit/)
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.4
      - name: Configure (Emscripten, the touch demo)
        run: emcmake cmake -S . -B build_web -DCMAKE_BUILD_TYPE=Release -DIMGUI_KIT_BUILD_EXAMPLES=ON -DIMGUI_KIT_BUILD_TESTS=OFF
      - name: Fetch Emscripten's GLFW port once (the parallel compiles would each download it)
        run: embuilder build contrib.glfw3
      - name: Build
        run: cmake --build build_web -j 4
      - name: The page's files
        run: mkdir site && cp build_web/examples/touch_demo/index.{html,js,wasm} site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
