name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config: [Release]
        include:
          - os: ubuntu-latest  # the asserts (IM_ASSERT) are compiled out in Release: one build keeps them
            config: Debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: GLFW's dependencies (the visible Test Engine tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xorg-dev libwayland-dev libxkbcommon-dev libgl-dev
      - name: The embedded JavaScript (its copy in the C++ is current, its syntax holds)
        if: runner.os == 'Linux'
        run: python3 tools/embed_js.py --check && node --check imgui_kit_emscripten_keyboard.js
      - name: Configure (Dear ImGui and its Test Engine fetched)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DIMGUI_KIT_BUILD_TEST_ENGINE_TESTS=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} -j 4
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  # The iOS example (Metal, UIKit's touches), built for the simulator: no signing. The SDL3 example is left out:
  # fetching and building SDL3 would add minutes to every run.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Xcode, the examples)
        run: cmake -S . -B build_ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DIMGUI_KIT_BUILD_EXAMPLES=ON -DIMGUI_KIT_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build_ios --config Release --target ios_touch_demo -- -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO

  # The Android example (the Android and OpenGL ES 3 backends, the fingers, the keyboard's height), one ABI
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build (Dear ImGui fetched)
        run: gradle assembleDebug -Pandroid.injected.build.abi=arm64-v8a
        working-directory: examples/android_touch_demo/android

  # The touch demo in a browser, published on the kit's GitHub Pages (https://pthom.github.io/imgui_kit/)
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.4
      - name: Configure (Emscripten, the touch demo)
        run: emcmake cmake -S . -B build_web -DCMAKE_BUILD_TYPE=Release -DIMGUI_KIT_BUILD_EXAMPLES=ON -DIMGUI_KIT_BUILD_TESTS=OFF
      - name: Fetch Emscripten's GLFW port once, with retries (its GitHub release download is flaky)
        run: for i in 1 2 3; do embuilder build contrib.glfw3 && break; sleep 10; done; embuilder build contrib.glfw3
      - name: Build
        run: cmake --build build_web -j 4
      - name: The page's files
        run: mkdir site && cp build_web/examples/touch_demo/index.{html,js,wasm} site/ && cp llms.txt site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
